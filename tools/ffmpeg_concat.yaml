identity:
  name: ffmpeg_concat
  author: william-cai
  label:
    en_US: Video Concatenation
    zh_Hans: 视频拼接
description:
  human:
    en_US: Merge multiple video URLs into a single video file using FFmpeg. Videos are concatenated in the order provided. **Note:** The output video is stored temporarily on Dify Cloud and is only available for 5 minutes.
    zh_Hans: 使用 FFmpeg 将多个视频 URL 合并为单个视频文件。视频按提供的顺序拼接。**注意：** 输出的视频文件存储在 Dify 云端，仅有 5 分钟有效期。
  llm: Merge multiple videos into one. Accepts a JSON array of video URLs and combines them sequentially into a single output video. The output file is temporary and expires after 5 minutes.
parameters:
  - name: video_urls
    type: string
    required: true
    label:
      en_US: Video URLs
      zh_Hans: 视频地址列表
    human_description:
      en_US: JSON array of video URLs, merged in order.
      zh_Hans: 视频 URL 的 JSON 数组，按顺序合并。
    llm_description: JSON array of video URLs, merged in order.
    form: llm
  - name: output_name
    type: string
    required: false
    label:
      en_US: Output file name
      zh_Hans: 输出文件名
    human_description:
      en_US: Output file name without extension. Default is merged_video.
      zh_Hans: 输出文件名（不含扩展名），默认 merged_video。
    llm_description: Output file name without extension.
    form: llm
extra:
  python:
    source: tools/ffmpeg_concat.py